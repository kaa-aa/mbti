<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MBTI로 나의 포켓몬 찾기</title>
    <style>
        /* 따뜻한 크림 & qnsghd색 톤 스타일링 */
        :root {
            --bg-color: #FFFDF0;
            --card-bg: #FFFFFF;
            --primary-color: #FFDE00;
            --primary-hover: #E6C800;
            --point-color: #FF7F50;
            --text-main: #333333;
            --text-sub: #666666;
            --shadow: 0 8px 24px rgba(0, 0, 0, 0.08);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Pretendard', 'Malgun Gothic', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 680px;
            background-color: var(--card-bg);
            border-radius: 24px;
            padding: 36px 28px;
            box-shadow: var(--shadow);
            text-align: center;
            border: 3px solid #FFF3A0;
        }

        h1 {
            font-size: 2rem;
            margin-bottom: 12px;
            color: #4A3E3D;
        }

        .subtitle {
            font-size: 1.1rem;
            color: var(--text-sub);
            margin-bottom: 28px;
        }

        /* MBTI 선택 그리드 */
        .mbti-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
        }

        @media (max-width: 480px) {
            .mbti-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        .mbti-btn {
            background-color: var(--bg-color);
            border: 2px solid #FFE866;
            border-radius: 16px;
            padding: 16px 8px;
            font-size: 1.2rem;
            font-weight: bold;
            color: #4A3E3D;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .mbti-btn:hover {
            background-color: var(--primary-color);
            transform: translateY(-3px);
            box-shadow: 0 4px 12px rgba(255, 222, 0, 0.4);
        }

        /* 결과 화면 (처음에는 숨김) */
        .result-card {
            display: none;
            animation: fadeIn 0.4s ease-in-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .pokemon-emoji {
            font-size: 7rem;
            line-height: 1.2;
            margin: 16px 0;
        }

        .pokemon-name {
            font-size: 1.8rem;
            font-weight: bold;
            color: #222;
            margin-bottom: 8px;
        }

        .mbti-tag {
            display: inline-block;
            background-color: var(--primary-color);
            padding: 6px 16px;
            border-radius: 20px;
            font-weight: bold;
            font-size: 1rem;
            margin-bottom: 20px;
        }

        .description {
            font-size: 1.15rem;
            line-height: 1.6;
            color: #444;
            background-color: var(--bg-color);
            padding: 20px;
            border-radius: 16px;
            margin-bottom: 24px;
            word-break: keep-all;
        }

        .chemistry-box {
            background-color: #FFF5E6;
            border: 2px dashed var(--point-color);
            padding: 16px;
            border-radius: 16px;
            font-size: 1.1rem;
            margin-bottom: 28px;
            color: #D35400;
        }

        .reset-btn {
            background-color: var(--point-color);
            color: white;
            border: none;
            padding: 14px 32px;
            font-size: 1.1rem;
            font-weight: bold;
            border-radius: 30px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .reset-btn:hover {
            background-color: #E66A3C;
            transform: scale(1.05);
        }
    </style>
</head>
<body>

<div class="container">
    <!-- 메인 선택 화면 -->
    <div id="selection-screen">
        <h1>⚡ MBTI 포켓몬 찾기 ⚡</h1>
        <p class="subtitle">나의 MBTI를 누르고 나와 닮은 포켓몬을 만나보세요!</p>
        <div class="mbti-grid" id="mbti-grid"></div>
    </div>

    <!-- 결과 화면 -->
    <div id="result-screen" class="result-card">
        <div class="mbti-tag" id="res-mbti"></div>
        <div class="pokemon-emoji" id="res-emoji"></div>
        <div class="pokemon-name" id="res-name"></div>
        <div class="description" id="res-desc"></div>
        <div class="chemistry-box" id="res-chem"></div>
        <button class="reset-btn" onclick="resetSelection()">🔄 다시 고르기</button>
    </div>
</div>

<script>
    // 16가지 MBTI별 포켓몬 데이터
    const pokemonData = {
        "ISTJ": {
            name: "방시혁 (해무기)",
            emoji: "🌊",
            desc: "묵묵히 자기 자리를 지키며 규칙을 잘 준수합니다.<br>조용하지만 한 번 맡은 일은 끝까지 책임감 있게 해내는 신뢰의 아이콘입니다.",
            match: "ESFP (마자용)"
        },
        "ISFJ": {
            name: "해피너스",
            emoji: "🌸",
            desc: "따뜻하고 상냥하여 주변 포켓몬을 다정하게 돌봐줍니다.<br>타인의 필요를 잘 차려주고, 평화롭고 안정적인 환경을 만드는 데 제일입니다.",
            match: "ESTP (라이츄)"
        },
        "INFJ": {
            name: "뮤",
            emoji: "✨",
            desc: "신비롭고 깊은 통찰력을 지닌 희귀한 포켓몬입니다.<br>겉으로는 수줍어 보이지만 세상을 이롭게 하려는 따뜻한 이상을 마음에 품고 있습니다.",
            match: "ENFP (피카츄)"
        },
        "INTJ": {
            name: "뮤츠",
            emoji: "🔮",
            desc: "독립적이고 철저한 계획을 세우는 용의주도한 전략가입니다.<br>높은 지능과 분석력으로 문제를 해결하며 완벽함을 추구합니다.",
            match: "ENTP (팬텀)"
        },
        "ISTP": {
            name: "파이리",
            emoji: "🔥",
            desc: "상황 적응력이 뛰어나고 도구를 다루는 데 능숙한 실용주의자입니다.<br>말보다는 행동으로 보여주며 침착함을 잃지 않는 매력이 있습니다.",
            match: "ESFJ (토게피)"
        },
        "ISFP": {
            name: "메타몽",
            emoji: "🫠",
            desc: "유연하고 예술적인 감각을 지닌 유유자적한 유쾌함의 소유자입니다.<br>주변 환경에 잘 맞춰 변신하며 현재의 자유로움을 가장 중요하게 생각합니다.",
            match: "ESTJ (괴력몬)"
        },
        "INFP": {
            name: "이브이",
            emoji: "🦊",
            desc: "무한한 가능성과 낭만을 품고 있는 공상가입니다.<br>따뜻한 마음씨를 가졌으며 자기만의 가치관과 감성을 소중히 여깁니다.",
            match: "ENTJ (리자몽)"
        },
        "INTP": {
            name: "고라파덕",
            emoji: "🦆",
            desc: "항상 깊은 생각에 잠겨 있는 호기심 많은 연구가입니다.<br>남들이 생각지 못한 기발한 아이디어와 독창적인 시각을 가지고 있습니다.",
            match: "ENFJ (망나뇽)"
        },
        "ESTP": {
            name: "라이츄",
            emoji: "⚡",
            desc: "에너지가 넘치고 언제나 에너제틱하게 스릴을 즐기는 모험가입니다.<br>순발력이 뛰어치며 문제 상황이 생기면 곧바로 몸으로 부딪쳐 해결합니다.",
            match: "ISFJ (해피너스)"
        },
        "ESFP": {
            name: "마자용",
            emoji: "🤪",
            desc: "어디서나 분위기 메이커 역할을 하는 유쾌하고 에너제틱한 타입입니다.<br>주변 사람들에게 즐거움을 주며 긍정적인 에너지를 뿜어냅니다.",
            match: "ISTJ (해무기)"
        },
        "ENFP": {
            name: "피카츄",
            emoji: "🐭",
            desc: "통통 튀는 호기심과 활력이 가득한 인싸 포켓몬입니다.<br>새로운 사람과 새로운 일에 끊임없이 열정을 불태우며 친화력이 엄청납니다.",
            match: "INFJ (뮤)"
        },
        "ENTP": {
            name: "팬텀",
            emoji: "👻",
            desc: "재치 있는 장난과 창의적인 생각으로 늘 눈길을 사로잡습니다.<br>기존의 틀에 매이지 않고 자유롭게 논쟁하며 새로운 길을 개척합니다.",
            match: "INTJ (뮤츠)"
        },
        "ESTJ": {
            name: "괴력몬",
            emoji: "💪",
            desc: "체계적이고 리더십이 뛰어난 질서정연한 리더입니다.<br>목표를 세우면 강한 추진력과 집행력으로 반드시 완수해 냅니다.",
            match: "ISFP (메타몽)"
        },
        "ESFJ": {
            name: "토게피",
            emoji: "🥚",
            desc: "친절하고 사교성이 뛰어나 누구와도 금방 친해집니다.<br>주변 사람들의 기분을 잘 살피며 행복과 행운을 전달해 주는 존재입니다.",
            match: "ISTP (파이리)"
        },
        "ENFJ": {
            name: "망나뇽",
            emoji: "🐉",
            desc: "마음이 넓고 온화하며 타인을 위해 앞장서는 든든한 조력자입니다.<br>사람들을 이끄는 매력이 있으며 모두가 함께 성장하도록 돕습니다.",
            match: "INTP (고라파덕)"
        },
        "ENTJ": {
            name: "리자몽",
            emoji: "🦖",
            desc: "당당한 카리스마와 강한 야망을 지닌 열정적인 지도자입니다.<br>어려운 장애물도 특유의 결단력과 과감함으로 이겨냅니다.",
            match: "INFP (이브이)"
        }
    };

    // 화면 로드 시 MBTI 버튼 생성
    window.onload = function() {
        const grid = document.getElementById('mbti-grid');
        Object.keys(pokemonData).forEach(mbti => {
            const btn = document.createElement('button');
            btn.className = 'mbti-btn';
            btn.innerText = mbti;
            btn.onclick = () => showResult(mbti);
            grid.appendChild(btn);
        });
    };

    // 결과 표시 함수
    function showResult(mbti) {
        const data = pokemonData[mbti];
        
        document.getElementById('res-mbti').innerText = mbti;
        document.getElementById('res-emoji').innerText = data.emoji;
        document.getElementById('res-name').innerText = data.name;
        document.getElementById('res-desc').innerHTML = data.desc;
        document.getElementById('res-chem').innerText = `❤️ 환상의 짝꿍 MBTI: ${data.match}`;

        document.getElementById('selection-screen').style.display = 'none';
        document.getElementById('result-screen').style.display = 'block';
    }

    // 다시 고르기 함수
    function resetSelection() {
        document.getElementById('result-screen').style.display = 'none';
        document.getElementById('selection-screen').style.display = 'block';
    }
</script>

</body>
</html>
